# 问题图项目运行态模板
# 节点类型只允许 question / claim / action。
# 节点状态只允许 open / testing / waiting_human / closed / pruned。
# Watch 是决策出口，不是节点状态；证据正文放在项目 evidence/，本文件只引用 ID。
# graph.yaml 是当前状态唯一事实源；普通历史差异由 Git 保存。

schema_version: 1

project:
  id: ""
  name: ""
  stage: "exploration" # exploration / validation / decision
  updated_at: ""
  decision_context: ""
  scope:
    geography: ""
    time_range: ""
    boundary: ""

central_question: "Q1"

nodes:
  - id: "Q1"
    type: "question"
    title: ""
    status: "open"
    why_it_matters: ""
    decision_link: ""
    evidence_ids: []
    reopen_when: []

  - id: "C1"
    type: "claim"
    title: ""
    status: "testing"
    confidence: "low" # low / medium / high；无充分依据时填 null
    confidence_basis: ""
    conditions: []
    implied_pricing: "" # 当前市值隐含的出货量、单价、份额、利润率、Capex、回款等前提；非估值任务可留空
    kill_criteria: [] # 可证伪条件与触发降级/推翻该 claim 的观测信号
    evidence_ids: []
    reopen_when: []

  - id: "A1"
    type: "action"
    title: ""
    status: "open"
    owner: "model" # model / human
    method: "search" # search / code / interview / field_check / monitoring
    next_step: ""
    expected_output: ""

edges:
  - from: "Q1"
    relation: "depends_on" # depends_on / supports / weakens / triggers
    to: "C1"
    explanation: ""

history:
  - date: ""
    change: ""
    reason: ""
    evidence_ids: []
